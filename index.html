<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中古車販売</title>
<meta name="description" content="在庫車両を毎日更新。全車支払総額表示の中古車販売店です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="hero" id="top">
    <div class="wrap">
      <div class="hero-body">
        <span class="hero-badge">全車 支払総額表示</span>
        <h1 id="hero-catch">&nbsp;</h1>
        <p id="hero-lead"></p>
        <div class="hero-actions">
          <a class="btn btn-accent" href="#stock">在庫車両を見る</a>
          <a class="btn btn-ghost-light" href="#service">無料 買取査定</a>
        </div>
      </div>
      <div class="hero-visual" id="hero-visual"></div>
    </div>
  </section>

  <div class="wrap search-wrap">
    <form class="search" id="search" aria-label="在庫検索">
      <label class="field">メーカー
        <select name="maker"><option value="">すべて</option></select>
      </label>
      <label class="field">ボディタイプ
        <select name="body"><option value="">すべて</option></select>
      </label>
      <label class="field">支払総額
        <select name="price">
          <option value="">上限なし</option>
          <option value="50">50万円以下</option>
          <option value="100">100万円以下</option>
          <option value="150">150万円以下</option>
          <option value="200">200万円以下</option>
          <option value="300">300万円以下</option>
        </select>
      </label>
      <button class="btn btn-navy" type="submit">この条件で探す</button>
    </form>
  </div>

  <section class="section" id="stock">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="eyebrow">STOCK</span>
          <h2>在庫車両</h2>
        </div>
        <div class="stock-meta">
          <span id="updated"></span>
          <span class="stock-count">掲載 <strong id="count">–</strong> 台</span>
        </div>
      </div>
      <div class="car-grid" id="car-grid" aria-live="polite">
        <p class="empty">読み込み中…</p>
      </div>
      <div class="more" id="more" hidden>
        <button class="btn btn-outline" type="button" id="more-btn">在庫をすべて見る</button>
      </div>
    </div>
  </section>

  <section class="section" id="service">
    <div class="wrap">
      <div class="sec-head">
        <div>
          <span class="eyebrow">SERVICE</span>
          <h2>買って終わりにしない、サポート</h2>
        </div>
      </div>
      <div class="svc-grid">
        <div class="svc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0F1B2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <h3>買取・下取り</h3>
          <p>他店で購入されたお車も査定します。写真を送っていただくだけの簡易査定にも対応しています。</p>
        </div>
        <div class="svc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0F1B2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
          <h3>車検・整備</h3>
          <p>点検・車検・オイル交換まで。ご購入後のメンテナンスもお任せください。</p>
        </div>
        <div class="svc">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0F1B2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
          <h3>オートローン</h3>
          <p id="loan-text">月々のお支払い額のシミュレーションもお気軽にご相談ください。</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="shop">
    <div class="wrap">
      <div class="shop-box">
        <div class="shop-info">
          <div>
            <span class="eyebrow">SHOP</span>
            <h2>店舗案内</h2>
          </div>
          <dl id="shop-dl"></dl>
        </div>
        <div class="shop-map" id="shop-map">地図</div>
      </div>
    </div>
  </section>

  <section class="cta-band" id="contact">
    <div class="wrap">
      <div>
        <h2>お問い合わせ・来店予約</h2>
        <p>在庫確認・お見積り・試乗のご予約はお気軽にどうぞ。</p>
      </div>
      <div class="cta-actions" id="cta-actions"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script type="module" src="js/home.js"></script>
</body>
</html>
